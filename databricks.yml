# Ingestion Framework — static engine bundle. Deployed ONCE per workspace;
# per-source pipelines/workflows are created by Pipeline Factory against the
# deployed engine files (ADR-008/009). This bundle registers NO per-source assets.
#
# It also registers NO jobs: recon and drift run as tasks INSIDE each
# source's workflow (ADR-011), and Salesforce schema discovery is served by
# the app itself (POST /api/connections/{name}/discover). The former
# pf-framework-recon / pf-framework-sfdc-describe helper jobs were retired
# with the v3.1 demo cleanup.
bundle:
  name: ingestion-framework

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-5ff279f3-09b2.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-5ff279f3-09b2.cloud.databricks.com
      root_path: /Workspace/ingestion-framework/prod
